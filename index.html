<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Tag 到處留名</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 依序載入腳本 -->
  <script src="js/i18n.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/net.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">

  <!-- 🚪 角色選擇入口 Modal -->
  <div id="entry-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-5">
      <div class="flex justify-end">
        <button onclick="I18n.setLang(I18n.lang === 'zh' ? 'en' : 'zh')" class="text-xs font-semibold px-2 py-1 rounded border border-slate-200 hover:bg-slate-50">
          🌐 <span class="lang-switch-text">EN</span>
        </button>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-slate-800" data-i18n="app_title">🏷️ Social Tag 到處留名</h2>
        <p class="text-xs text-slate-500" data-i18n="entry_subtitle">請選擇你的身份以進入房間</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1" data-i18n="room_label">房間號碼</label>
        <input id="input-room" type="text" value="" placeholder="eg. 0725" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
      </div>

      <div class="space-y-3 pt-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-600" data-i18n="name_label">學員名字</label>
          <div class="flex gap-2">
            <input id="input-name" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="btn-join-client" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg whitespace-nowrap transition" data-i18n="btn_enter">
              進入
            </button>
          </div>
        </div>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-2 text-xs text-slate-400" data-i18n="or_divider">或者</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button id="btn-join-host" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm transition" data-i18n="btn_host">
          🖥️ 我是主持人（開房／投影）
        </button>
      </div>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="max-w-md md:max-w-xl mx-auto bg-white rounded-xl shadow-md p-6 space-y-4">
    <!-- 頂部標題列與語言切換 -->
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="font-bold text-lg text-slate-800 tracking-tight" id="app-title" data-i18n="app_title">🏷️ Social Tag 到處留名</h1>
      </div>
      <div class="flex items-center gap-2">
        <span id="role-badge" class="text-xs px-2.5 py-1 rounded-full font-medium bg-slate-200"></span>
        <button onclick="I18n.setLang(I18n.lang === 'zh' ? 'en' : 'zh')" class="text-xs font-semibold px-2 py-0.5 rounded border border-slate-300 hover:bg-slate-100">
          <span class="lang-switch-text">EN</span>
        </button>
      </div>
    </div>

    <!-- 狀態資訊面板 -->
    <div id="status-panel" class="bg-slate-50 p-3.5 rounded-lg text-sm space-y-1.5 border border-slate-100">
      <div class="flex justify-between">
        <span><span data-i18n="status_label">當前階段：</span><span id="room-status" class="font-bold text-slate-700">LOBBY</span></span>
        <span id="sticker-box"><span data-i18n="stickers_left">手上剩餘：</span><span id="my-stickers" class="font-bold text-emerald-600">3</span><span data-i18n="stickers_unit"> 張</span></span>
      </div>
      <div class="text-xs text-slate-500"><span data-i18n="time_left">倒數時間：</span><span id="timer-display" class="font-mono text-indigo-600 font-bold text-sm">--:--</span></div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard-box" class="hidden space-y-2 pt-3 border-t">
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
        <div class="text-xs font-semibold text-amber-700 mb-1" data-i18n="lb_popular">🏆 人氣磁鐵獎（標籤最多）</div>
        <div id="lb-most-received" class="font-bold text-slate-800"></div>
      </div>
      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3">
        <div class="text-xs font-semibold text-indigo-700 mb-1" data-i18n="lb_fastest">⚡ 閃電外交官（最快送完）</div>
        <div id="lb-fastest" class="font-bold text-slate-800 text-sm"></div>
      </div>
    </div>

    <!-- 進度條 -->
    <div id="progress-box" class="hidden space-y-1.5 pt-3 border-t">
      <div class="flex justify-between text-xs font-semibold text-slate-600">
        <span data-i18n="reclaim_progress">物歸原主進度</span>
        <span id="progress-text" class="text-indigo-600 font-bold">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Host 按鈕 -->
    <div id="host-controls" class="hidden space-y-2 pt-2 border-t">
      <button id="btn-start" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm" data-i18n="btn_start">開始活動 (5分鐘)</button>
      <button id="btn-reclaim" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg text-sm hidden transition shadow-sm" data-i18n="btn_reclaim">提早進入物歸原主</button>
    </div>

    <!-- Client 名單 -->
    <div id="client-view" class="space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="list_friends">在場朋友 (點擊貼標籤)</h2>
      <div id="participant-list" class="space-y-2"></div>

      <div id="received-box" class="pt-4 border-t space-y-2">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="list_received">我身上收到的標籤 (物歸原主用)</h2>
        <div id="received-list" class="space-y-1"></div>
      </div>
    </div>
  </div>
</body>
</html>
