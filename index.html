<!DOCTYPE html>
<html lang="zh-HK" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
  
  <!-- 🔍 Google 站長驗證 -->
  <meta name="google-site-verification" content="JZ5UohX-CcP_fQV0_DI9VadkKY4ZoTTkUifL88-fIcY" />

  <!-- 🔍 基礎 SEO 核心標籤 -->
  <title>🏷️ Social Tag 到處留名 | 互動破冰遊戲 (Social Tag Icebreaker)</title>
  <meta name="description" content="Social Tag 到處留名是一款為企業培訓、大型工作坊及團隊破冰設計的輕量級互動遊戲。純前端零後端架構，支援 6 位數多房獨立運作、動態 QR Code 秒速入場、50人防爆隔離與即時中英切換。">
  <meta name="keywords" content="破冰遊戲, 企業培訓, 團隊建立, Team Building, Icebreaker, Social Tag, QR Code入場, PWA, 數位破冰, 到處留名, 雙語互動">
  <meta name="author" content="Social Tag Lab">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jackylawck.github.io/SocialTag/">

  <!-- 🌐 Open Graph / Facebook / LinkedIn 社交分享卡片 -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jackylawck.github.io/SocialTag/">
  <meta property="og:title" content="🏷️ Social Tag 到處留名 | 企業培訓互動破冰神器">
  <meta property="og:description" content="告別尷尬破冰！手機掃描 QR Code 即刻入場，貼名牌、換標籤、物歸原主，大螢幕即時榜單互動。">
  <meta property="og:image" content="https://jackylawck.github.io/SocialTag/SocialTag512icon.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:image:alt" content="Social Tag 到處留名遊戲圖示">
  <meta property="og:locale" content="zh_HK">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:site_name" content="Social Tag 到處留名">

  <!-- 🐦 Twitter Cards -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="🏷️ Social Tag 到處留名 | 互動破冰遊戲">
  <meta name="twitter:description" content="純前端 Serverless 社交名牌破冰遊戲，掃碼直入，流暢支援多房獨立對抗與大螢幕投影。">
  <meta name="twitter:image" content="https://jackylawck.github.io/SocialTag/SocialTag512icon.png">

  <!-- 📱 PWA 與手機主畫面圖示支援 -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="SocialTag192icon.png">
  <link rel="apple-touch-icon" sizes="512x512" href="SocialTag512icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="SocialTag192icon.png">
  <link rel="icon" type="image/png" sizes="512x512" href="SocialTag512icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Social Tag">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#4f46e5">
  <meta name="application-name" content="Social Tag">

  <!-- 🛡️ 企業級安全策略：嚴格 Content Security Policy (CSP) 與權限隔離 -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https://jackylawck.github.io;
    font-src 'self' data:;
    connect-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">
  <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- 依序載入腳本與樣式庫 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/i18n.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/net.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 min-h-screen">

  <!-- 🚪 角色選擇入口 Modal -->
  <div id="entry-modal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl space-y-5">
      <div class="flex justify-end">
        <button onclick="I18n.setLang(I18n.lang === 'zh' ? 'en' : 'zh')" class="text-xs font-semibold px-2 py-1 rounded border border-slate-200 hover:bg-slate-50">
          🌐 <span class="lang-switch-text">EN</span>
        </button>
      </div>
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-slate-800" data-i18n="app_title">🏷️ Social Tag 到處留名</h2>
        <p class="text-xs text-slate-500" data-i18n="entry_subtitle">請選擇你的身份以進入房間</p>
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="block text-xs font-semibold text-slate-600" data-i18n="room_label">房間號碼</label>
          <button type="button" id="btn-random-room" class="text-xs text-indigo-600 hover:underline" data-i18n="btn_random_room">🎲 隨機新房</button>
        </div>
        <!-- 🌟 加入 inputmode="numeric"，手機點擊自動彈出 9 宮格數字鍵盤 -->
        <input id="input-room" type="text" inputmode="numeric" maxlength="6" value="" placeholder="留空將自動生成 6 位數字房號" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 font-mono tracking-wider">
      </div>

      <div class="space-y-3 pt-2">
        <div class="space-y-2">
          <label class="block text-xs font-semibold text-slate-600" data-i18n="name_label">學員名字</label>
          <div class="flex gap-2">
            <input id="input-name" type="text" class="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <button id="btn-join-client" class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg whitespace-nowrap transition" data-i18n="btn_enter">
              進入
            </button>
          </div>
        </div>

        <div class="relative flex py-1 items-center">
          <div class="flex-grow border-t border-slate-200"></div>
          <span class="flex-shrink mx-2 text-xs text-slate-400" data-i18n="or_divider">或者</span>
          <div class="flex-grow border-t border-slate-200"></div>
        </div>

        <button id="btn-join-host" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2.5 rounded-lg text-sm transition" data-i18n="btn_host">
          🖥️ 我是主持人（開房／投影）
        </button>
      </div>
    </div>
  </div>

  <!-- 主容器 -->
  <div class="max-w-md md:max-w-xl mx-auto bg-white rounded-xl shadow-md p-6 space-y-4">
    <!-- 頂部標題列與離開按鈕 -->
    <div class="flex justify-between items-center border-b pb-3">
      <div>
        <h1 class="font-bold text-lg text-slate-800 tracking-tight" data-i18n="app_title">🏷️ Social Tag 到處留名</h1>
        <div class="text-xs text-slate-500 mt-0.5">
          <span data-i18n="room_label">房間號碼</span>: <span id="display-room-id" class="font-mono font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">--</span>
        </div>
      </div>
      <div class="flex items-center gap-1.5 sm:gap-2">
        <span id="role-badge" class="text-xs px-2.5 py-1 rounded-full font-medium bg-slate-200"></span>
        <button onclick="I18n.setLang(I18n.lang === 'zh' ? 'en' : 'zh')" class="text-xs font-semibold px-2 py-0.5 rounded border border-slate-300 hover:bg-slate-100">
          <span class="lang-switch-text">EN</span>
        </button>
        <!-- 🚪 離開房間 / 返回首頁 -->
        <button id="btn-leave-room" class="text-xs font-semibold px-2.5 py-0.5 rounded border border-rose-200 text-rose-600 bg-rose-50 hover:bg-rose-100 transition flex items-center gap-1" data-i18n="btn_leave">
          🚪 離開
        </button>
      </div>
    </div>

    <!-- 🌟 主持人大螢幕專屬：QR Code 掃碼直入區 -->
    <div id="host-invite-box" class="hidden bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-center gap-4 text-center sm:text-left">
      <div id="qrcode-container" class="bg-white p-2.5 rounded-xl shadow-sm border border-indigo-100 flex-shrink-0"></div>
      <div class="space-y-1">
        <div class="text-sm font-bold text-indigo-950" data-i18n="qr_title">📷 手機掃描 QR Code 即刻入場</div>
        <p class="text-xs text-slate-500" data-i18n="qr_desc">掃完直接打名即刻玩，無須輸入網址</p>
        <div class="text-xs font-semibold text-indigo-600 pt-1">
          <span data-i18n="host_invite_code">房間代碼：</span><span id="invite-room-code" class="font-mono font-bold bg-white px-2 py-0.5 rounded border border-indigo-200">--</span>
        </div>
      </div>
    </div>

    <!-- 狀態資訊面板 -->
    <div id="status-panel" class="bg-slate-50 p-3.5 rounded-lg text-sm space-y-1.5 border border-slate-100">
      <div class="flex justify-between">
        <span><span data-i18n="status_label">當前階段：</span><span id="room-status" class="font-bold text-slate-700">LOBBY</span></span>
        <span id="sticker-box"><span data-i18n="stickers_left">手上剩餘：</span><span id="my-stickers" class="font-bold text-emerald-600">3</span><span data-i18n="stickers_unit"> 張</span></span>
      </div>
      <div class="text-xs text-slate-500"><span data-i18n="time_left">倒數時間：</span><span id="timer-display" class="font-mono text-indigo-600 font-bold text-sm">--:--</span></div>
    </div>

    <!-- Leaderboard -->
    <div id="leaderboard-box" class="hidden space-y-2 pt-3 border-t">
      <div class="bg-amber-50 border border-amber-200 rounded-lg p-3">
        <div class="text-xs font-semibold text-amber-700 mb-1" data-i18n="lb_popular">🏆 人氣磁鐵獎（標籤最多）</div>
        <div id="lb-most-received" class="font-bold text-slate-800"></div>
      </div>
      <div class="bg-indigo-50 border border-indigo-200 rounded-lg p-3">
        <div class="text-xs font-semibold text-indigo-700 mb-1" data-i18n="lb_fastest">⚡ 閃電外交官（最快送完）</div>
        <div id="lb-fastest" class="font-bold text-slate-800 text-sm"></div>
      </div>
    </div>

    <!-- 進度條 -->
    <div id="progress-box" class="hidden space-y-1.5 pt-3 border-t">
      <div class="flex justify-between text-xs font-semibold text-slate-600">
        <span data-i18n="reclaim_progress">物歸原主進度</span>
        <span id="progress-text" class="text-indigo-600 font-bold">0%</span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
        <div id="progress-bar" class="bg-indigo-600 h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
      </div>
    </div>

    <!-- Host 控制區 -->
    <div id="host-controls" class="hidden space-y-2 pt-2 border-t">
      <button id="btn-start" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm" data-i18n="btn_start">開始活動 (5分鐘)</button>
      <button id="btn-reclaim" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-medium py-2.5 rounded-lg text-sm hidden transition shadow-sm" data-i18n="btn_reclaim">提早進入物歸原主</button>
      <button id="btn-reset" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 font-medium py-1.5 rounded-lg text-xs transition" data-i18n="btn_reset">
        🔄 重設房間（重新開局）
      </button>
    </div>

    <!-- Client 名單 -->
    <div id="client-view" class="space-y-3">
      <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="list_friends">在場朋友 (點擊貼標籤)</h2>
      <div id="participant-list" class="space-y-2"></div>

      <div id="received-box" class="pt-4 border-t space-y-2">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider" data-i18n="list_received">我身上收到的標籤 (物歸原主用)</h2>
        <div id="received-list" class="space-y-1"></div>
      </div>
    </div>
  </div>
</body>
</html>
